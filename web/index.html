<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aetheria Graph - AI-powered personal growth and mental wellness companion">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aetheria Graph">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aetheria Graph</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // API key for Groq AI (used by the web AI chat page).
    // Left EMPTY on purpose: the real key is injected at build time from the
    // GitHub repository secret GROQ_API_KEY by .github/workflows/deploy.yml.
    window.groqApiKey = '';
    // flutterConfig object read by Dart via JS interop (window.flutterConfig.groqApiKey)
    window.flutterConfig = {
      groqApiKey: ''
    };
  </script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
